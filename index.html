<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Этот тег обязателен для адаптации под мобильные экраны -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Key System</title>
    <style>
        body { 
            background: #0f172a; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            box-sizing: border-box;
        }
        .card { 
            background: #1e293b; 
            padding: 25px 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            text-align: center; 
            width: 100%; 
            max-width: 380px; 
            box-sizing: border-box;
        }
        h2 { margin-bottom: 10px; color: #38bdf8; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        input { 
            width: 100%; 
            padding: 14px 10px; 
            box-sizing: border-box; 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: #38bdf8; 
            font-size: 16px; 
            text-align: center; 
            border-radius: 6px; 
            outline: none; 
            cursor: pointer; 
        }
        .note { font-size: 12px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Aether Key System</h2>
        <p id="statusText">Ваш ключ действителен на текущий 6-часовой интервал.</p>
        <input type="text" id="keyBox" readonly>
        <div class="note" id="noteText">Нажмите на поле, чтобы скопировать ключ</div>
    </div>

    <script>
        // Получаем параметры из адресной строки
        const urlParams = new URLSearchParams(window.location.search);
        const isUnlocked = urlParams.get('unlocked');
        
        // Автоматический расчет текущего 6-часового блока
        const date = new Date();
        const timeBlock = Math.floor((date.getTime() / (1000 * 60 * 60)) / 6);
        
        const keyBox = document.getElementById('keyBox');
        const statusText = document.getElementById('statusText');
        const noteText = document.getElementById('noteText');

        // Если пользователь пришел по правильной ссылке с рекламы
        if (isUnlocked === 'true') {
            localStorage.setItem('aether_block', timeBlock);
            localStorage.setItem('aether_unlocked', 'true');
            
            // Очищаем URL от параметра, чтобы при обновлении страница снова не считалась разблокированной
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Проверяем, есть ли валидный токен и совпадает ли текущий 6-часовой интервал
        const savedBlock = localStorage.getItem('aether_block');
        const hasToken = localStorage.getItem('aether_unlocked');

        if (hasToken === 'true' && savedBlock == timeBlock) {
            // Генерируем действующий ключ
            const generatedKey = "AETHER_" + (timeBlock * 777).toString(36).toUpperCase();
            keyBox.value = generatedKey;
            
            // Вешаем событие копирования для мобильных устройств
            keyBox.style.cursor = "pointer";
            keyBox.onclick = function() {
                this.select();
                this.setSelectionRange(0, 99999); // Для корректной работы на мобильных ОС
                navigator.clipboard.writeText(this.value).then(() => {
                    alert('Ключ скопирован!');
                }).catch(() => {
                    document.execCommand('copy');
                    alert('Ключ скопирован!');
                });
            };
        } else {
            // Если зашли напрямую или обновили страницу — сбрасываем доступ
            localStorage.removeItem('aether_unlocked');
            keyBox.value = "ТРЕБУЕТСЯ КЛЮЧ";
            keyBox.style.color = "#ef4444";
            statusText.innerText = "Доступ заблокирован. Пройдите по ссылке рекламы!";
            noteText.innerText = "Обновление страницы не сбрасывает таймер рекламы.";
        }
    </script>
</body>
</html>
